<!doctype html><meta charset="utf-8"><title>ByteInk matched geometry benchmark</title>
<script>
let paths, canvas, context;
function initialize(encoded) {
  const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
  const data = new DataView(bytes.buffer); let offset = 0;
  const integer = () => { const value = data.getInt32(offset); offset += 4; return value; };
  const scalar = () => { const value = data.getFloat32(offset); offset += 4; return value; };
  if (String.fromCharCode(...bytes.slice(0, 8)) !== 'BYTCMP01') throw Error('scene magic');
  offset = 8; const count = integer(); paths = [];
  for (let p = 0; p < count; p++) {
    const inputs = integer(); offset += inputs * 20;
    const outlines = integer(), path = new Path2D();
    for (let o = 0; o < outlines; o++) {
      const size = integer();
      for (let i = 0; i < size; i += 2) {
        const x = scalar(), y = scalar();
        if (i === 0) path.moveTo(x, y); else path.lineTo(x, y);
      }
      path.closePath();
    }
    paths.push(path);
  }
  if (offset !== bytes.length) throw Error('scene end');
}
function runCase(c) {
  canvas = document.createElement('canvas'); canvas.width = c.width; canvas.height = c.height;
  context = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
  context.globalCompositeOperation = 'source-over';
  const columns = Math.max(1, Math.ceil(Math.sqrt(c.count * 1920 / 1080))), rows = Math.max(1, Math.ceil(c.count / columns));
  const sx = Math.fround(c.width / 1920), sy = Math.fround(c.height / 1080), zoom = Math.fround(c.zoom);
  const transforms = Array.from({ length: c.count }, (_, i) => {
    const x = Math.fround(6 + Math.fround((i % columns) * Math.fround(1908 / columns)));
    const y = Math.fround(6 + Math.fround(Math.floor(i / columns) * Math.fround(1068 / rows)));
    return [Math.fround(sx * zoom), Math.fround(sy * zoom), Math.fround(x * sx), Math.fround(y * sy)];
  });
  const wall_ns = [];
  for (let i = -c.warmup; i < c.measured; i++) {
    const start = process.hrtime.bigint();
    context.resetTransform(); context.fillStyle = '#ffffff'; context.fillRect(0, 0, c.width, c.height);
    context.fillStyle = c.alpha ? '#33415566' : '#334155';
    for (let j = 0; j < c.count; j++) {
      const [a, d, e, f] = transforms[j]; context.setTransform(a, 0, 0, d, e, f);
      context.fill(paths[j % paths.length], 'nonzero');
    }
    // Flush deferred Canvas2D commands. This mandatory one-pixel readback is included and disclosed.
    context.getImageData(0, 0, 1, 1);
    const elapsed = Number(process.hrtime.bigint() - start);
    if (i >= 0) wall_ns.push(elapsed);
  }
  return { name: c.name, wall_ns, png: canvas.toDataURL('image/png').split(',')[1], attributes: context.getContextAttributes() };
}
function releaseCase() { canvas.width = 0; canvas.height = 0; context = null; canvas = null; }
</script>

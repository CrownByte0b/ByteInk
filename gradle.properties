# ByteInk's version: bump it here and nowhere else. A checkout builds <version>-SNAPSHOT; a v<version>
# tag, or ci's manual version input, publishes <version> itself. The fixture and wiki-example builds
# and the wiki pages read it from here. README.md cannot, so the wiki build fails until its
# coordinates and badge name this version.
byteinkReleaseVersion=0.2.1
#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
# The opt-in Wasm build uses the installed Node/npm; SDK repositories remain settings-owned.
kotlin.js.yarn=false

# Upstream pins for byteink, beyond the AndroidX Ink version itself (gradle/libs.versions.toml,
# `androidx-ink`) and the checksums of its artifacts (gradle/verification-metadata.xml).
# How these were established and how to move them: upstream/README.md.

# frameworks/support commit at the end of the pinned release's commit range (Ink release notes).
# The reference checkout in androidx-ink/ and the fork in ink-nativeloader/ come from here.
androidx.support.commit=61ee8cd421d0c0252d8db0253b739de537999371
androidx.support.repository=https://github.com/androidx/androidx.git

# The google/ink commit byteink builds its natives from. Google's 1.1.0-alpha06 binary has exactly
# the JNI surface of every commit from d38cbb3d5e8a to 66b1db31d937 (./gradlew :upstream:scanGoogleInk).
# The release dates narrow that to the candidates below. The differential oracle
# (:conformance:oracle) settled it: Google's binary computes outlines for subtracted meshes, as
# 96e50239e1c8 ("Compute outlines for subtracted meshes") does and d38cbb3d5e8a and 480b45ff2390 do
# not (258 erase values). ee5d4005f036 and f6e53da6f452 differ from 96e50239e1c8 only in test code
# and an #include.
google.ink.repository=https://github.com/google/ink.git
google.ink.commit=96e50239e1c8955f7e222301661b595847d7de83
google.ink.candidates=\
  d38cbb3d5e8a100a8de8b6fa1567847b4f5c1232,\
  480b45ff2390a7f95c8090ca54fcc54397b22910,\
  96e50239e1c8955f7e222301661b595847d7de83,\
  ee5d4005f036ab547cf628c19231121a011c7c13,\
  f6e53da6f452ff68740e2ed62c27c44925adc501

# How google/ink built at that commit: its CI's USE_BAZEL_VERSION, and the toolchains_llvm LLVM
# release its MODULE.bazel registers.
bazel.version=8.7.0
llvm.version=19.1.0

# The Bazel launcher native/ builds with (github.com/bazelbuild/bazelisk releases).
bazelisk.version=1.29.0
bazelisk.linux-amd64.sha256=5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
bazelisk.windows-amd64.sha256=092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b


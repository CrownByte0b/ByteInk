name: Publish

# ci calls this with upload after every check in the same run passes. Started alone it never
# uploads: it stages the same publications in build/repo and keeps them as an artifact.
on:
  workflow_call:
    inputs:
      version:
        description: Validated release version that the calling run tested
        required: true
        type: string
      upload:
        description: Upload to GitHub Packages instead of staging
        required: false
        default: false
        type: boolean
      artifacts-run-id:
        description: Run that holds the native artifacts, or latest; empty means this run
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version whose publications to stage (e.g. 0.1.0); nothing is uploaded'
        required: true
        type: string
      artifacts-run-id:
        description: 'Run ID holding the native artifacts; latest takes the newest on this branch, then the default branch'
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: ${{ inputs.upload && 'Publish tested version to GitHub Packages' || 'Stage publications without uploading' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the coordinates tested by the matrix
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release-versions.sh "v$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Locate native artifacts from an earlier run
        id: artifacts
        if: inputs.artifacts-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts-run-id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          linux=$(bash .github/scripts/artifacts-run.sh "$ARTIFACTS_RUN_ID" libink-linux-x86_64 libink-linux-x86_64-debug-symbols)
          windows=$(bash .github/scripts/artifacts-run.sh "$ARTIFACTS_RUN_ID" ink-windows-x86_64)
          printf 'linux=%s\nwindows=%s\n' "$linux" "$windows" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 27
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      # Without a token, download-artifact reads the current run; a token selects run-id instead.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libink-linux-x86_64
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.linux && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.linux || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libink-linux-x86_64-debug-symbols
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.linux && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.linux || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ink-windows-x86_64
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.windows && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.windows || github.run_id }}
      - name: Publish libraries, sources, metadata and separate Linux symbols
        if: inputs.upload
        run: >-
          ./gradlew :upstream:checkLinuxLibrary :upstream:checkWindowsLibrary
          :ink-nativeloader:publishAllPublicationsToGitHubPackagesRepository
          :byteink-core:publishAllPublicationsToGitHubPackagesRepository
          :byteink-kit:publishAllPublicationsToGitHubPackagesRepository
          :byteink-compose:publishAllPublicationsToGitHubPackagesRepository
          :byteink-testing:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage the same publications in build/repo
        if: ${{ !inputs.upload }}
        run: >-
          ./gradlew :upstream:checkLinuxLibrary :upstream:checkWindowsLibrary
          :ink-nativeloader:publishAllPublicationsToBuildRepository
          :byteink-core:publishAllPublicationsToBuildRepository
          :byteink-kit:publishAllPublicationsToBuildRepository
          :byteink-compose:publishAllPublicationsToBuildRepository
          :byteink-testing:publishAllPublicationsToBuildRepository
      - name: Upload staged publications
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-publications
          path: build/repo/
          if-no-files-found: error

name: JVM Linux

# Called by ci after the native jobs. Run alone, it takes the native libraries from an earlier
# run that .github/scripts/artifacts-run.sh selects.
on:
  workflow_call:
    inputs:
      version:
        description: Validated release version whose coordinates to test; empty uses development coordinates
        required: false
        default: ''
        type: string
      runtime:
        description: all, zulu25, zulu27 or jbr25
        required: false
        default: all
        type: string
      artifacts-run-id:
        description: Run that holds the native artifacts, or latest; empty means this run
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      runtime:
        description: Test runtime
        required: true
        default: all
        type: choice
        options: [all, zulu25, zulu27, jbr25]
      artifacts-run-id:
        description: 'Run ID holding the native artifacts; latest takes the newest on this branch, then the default branch'
        required: true
        default: latest
        type: string
      version:
        description: 'Release version whose coordinates to test (e.g. 0.1.0); leave empty for development coordinates'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  jvm-linux:
    name: Linux / ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.runtime == 'all' && '["zulu25","zulu27","jbr25"]' || format('["{0}"]', inputs.runtime)) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select exact release coordinates
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release-versions.sh "v$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Locate native artifacts from an earlier run
        id: artifacts
        if: inputs.artifacts-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts-run-id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          linux=$(bash .github/scripts/artifacts-run.sh "$ARTIFACTS_RUN_ID" libink-linux-x86_64 libink-linux-x86_64-debug-symbols oracle-baseline-linux-x64)
          windows=$(bash .github/scripts/artifacts-run.sh "$ARTIFACTS_RUN_ID" ink-windows-x86_64)
          printf 'linux=%s\nwindows=%s\n' "$linux" "$windows" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: |
            25
            27
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Select Zulu test runtime
        if: matrix.runtime != 'jbr25'
        run: |
          if [[ '${{ matrix.runtime }}' == zulu25 ]]; then
            echo "BYTEINK_TEST_JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
          else
            echo "BYTEINK_TEST_JAVA_HOME=$JAVA_HOME_27_X64" >> "$GITHUB_ENV"
          fi
      - name: Install pinned JBR 25 SDK
        if: matrix.runtime == 'jbr25'
        run: bash .github/scripts/setup-jbr.sh linux-x64
      # Without a token, download-artifact reads the current run; a token selects run-id instead.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libink-linux-x86_64
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.linux && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.linux || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libink-linux-x86_64-debug-symbols
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.linux && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.linux || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ink-windows-x86_64
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.windows && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.windows || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oracle-baseline-linux-x64
          path: native/build/oracle-linux-x64
          github-token: ${{ steps.artifacts.outputs.linux && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.linux || github.run_id }}
      - name: Build, consumer smoke, full suites, engine oracle and synthetic fidelity reports
        run: >-
          ./gradlew build :upstream:checkLinuxLibrary :upstream:checkWindowsLibrary
          :conformance:oracle:oracleCompare :conformance:oracle:oracleProduction :conformance:oracle:installDist
          :byteink-testing:desktopParityDump :byteink-testing:androidFidelityMatrix --continue
          "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME"
          -PbyteinkFuzzIterations=20000 -PbyteinkFuzzSeed=${{ github.run_number }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_27_X64
          -Porg.gradle.java.installations.auto-download=false
      - name: Install offscreen OpenGL and EGL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libvulkan1 mesa-vulkan-drivers libxi6 libxtst6
      - name: Verify mesh shaders on OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a ./gradlew :byteink-compose:meshGpuTest :byteink-compose:desktopPenTest
          "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME"
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_27_X64
          -Porg.gradle.java.installations.auto-download=false
      - name: Verify mesh shaders on EGL without X11
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
        run: >-
          env -u DISPLAY ./gradlew :byteink-compose:meshEglTest
          "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME"
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_27_X64
          -Porg.gradle.java.installations.auto-download=false
      - name: Install native Wayland test dependencies
        if: matrix.runtime == 'jbr25'
        run: sudo apt-get install -y weston libwayland-dev libweston-13-dev build-essential pkg-config
      - name: Verify native Wayland tablet and immediate authoring
        if: matrix.runtime == 'jbr25'
        run: |
          for scale in 1 2; do
            BYTEINK_WAYLAND_TEST_SCALE="$scale" bash byteink-compose/src/test/wayland/run.sh \
              "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME" \
              -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_27_X64 \
              -Porg.gradle.java.installations.auto-download=false
          done
      - name: Verify native Wayland shared-memory and Mesa Vulkan presentation
        if: matrix.runtime == 'jbr25'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
        run: |
          # Mesa packages use either an architecture-qualified or a plain ICD filename.
          lavapipe_icd=$(dpkg -L mesa-vulkan-drivers | sed -n '/\/lvp_icd\(\.x86_64\)\?\.json$/p')
          [[ -n "$lavapipe_icd" && -f "$lavapipe_icd" ]] || {
            echo 'Expected one installed Mesa lavapipe ICD manifest.' >&2
            exit 1
          }
          printf 'Mesa lavapipe ICD: %s\n' "$lavapipe_icd"
          export VK_DRIVER_FILES="$lavapipe_icd" VK_ICD_FILENAMES="$lavapipe_icd"
          for vulkan in false true; do
            for scale in 1 2; do
              BYTEINK_WAYLAND_TEST_SUITE=presentation BYTEINK_WAYLAND_TEST_VULKAN="$vulkan" \
                BYTEINK_WAYLAND_TEST_SCALE="$scale" \
                BYTEINK_WAYLAND_TEST_OUTPUT="$PWD/build/wayland-presentation/vulkan-$vulkan-scale-$scale" \
                bash byteink-compose/src/test/wayland/run.sh \
                "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME" \
                -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_27_X64 \
                -Porg.gradle.java.installations.auto-download=false
            done
          done
      - name: Verify unavailable Vulkan falls back to shared memory
        if: matrix.runtime == 'jbr25'
        env:
          VK_DRIVER_FILES: /tmp/byteink-deliberately-no-such-vulkan-icd.json
          VK_ICD_FILENAMES: /tmp/byteink-deliberately-no-such-vulkan-icd.json
          BYTEINK_WAYLAND_TEST_SUITE: presentation
          BYTEINK_WAYLAND_TEST_VULKAN: "true"
          BYTEINK_WAYLAND_TEST_BACKEND: shm
        run: >-
          BYTEINK_WAYLAND_TEST_OUTPUT="$PWD/build/wayland-presentation/unavailable-vulkan"
          bash byteink-compose/src/test/wayland/run.sh
          "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME"
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_27_X64
          -Porg.gradle.java.installations.auto-download=false
      - name: Upload Linux reference geometry and notebook bytes
        if: matrix.runtime == 'zulu27'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-parity-reference
          path: |
            conformance/oracle/build/oracle/
            byteink-testing/build/desktop-parity/
          if-no-files-found: error
      - name: Upload oracle application for VM comparisons
        if: matrix.runtime == 'zulu27'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-application
          path: conformance/oracle/build/install/oracle/
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.runtime }}-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            byteink-compose/build/reports/wayland-gpu/
            build/wayland-presentation/
            conformance/oracle/build/reports/
            byteink-compose/build/reports/performance/
            byteink-testing/build/reports/performance/
            byteink-testing/build/reports/android-matrix*/
            consumer-tests/build/reports/consumer/
            **/hs_err_pid*.log
            build/wayland-pen/fixture/*.xml
            build/wayland-pen/fixture/*.log
          if-no-files-found: error

name: JVM Linux arm64

# Called by ci after JVM Linux. Runs the full build, the arm64 upstream C++ subset, X11/EGL and
# native Wayland checks on an arm64 runner, and compares engine geometry and notebook output with the
# Linux x86_64 reference strictly. Run alone, it takes the native libraries, C++ tests and reference
# from earlier runs that .github/scripts/artifacts-run.sh selects.
on:
  workflow_call:
    inputs:
      version:
        description: Validated release version whose coordinates to test; empty uses development coordinates
        required: false
        default: ''
        type: string
      runtime:
        description: all, zulu25, zulu27 or jbr25
        required: false
        default: all
        type: string
      artifacts-run-id:
        description: Run that holds the native artifacts and Linux reference, or latest; empty means this run
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      runtime:
        description: Test runtime
        required: true
        default: all
        type: choice
        options: [all, zulu25, zulu27, jbr25]
      artifacts-run-id:
        description: 'Run ID holding the native artifacts and Linux reference; latest takes the newest on this branch, then the default branch'
        required: true
        default: latest
        type: string
      version:
        description: 'Release version whose coordinates to test (e.g. 0.1.0); leave empty for development coordinates'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  jvm-linux-arm64:
    name: Linux arm64 / ${{ matrix.runtime }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.runtime == 'all' && '["zulu25","zulu27","jbr25"]' || format('["{0}"]', inputs.runtime)) }}
    defaults:
      run:
        shell: bash
    env:
      # setup-java names its homes after the architecture it installs, given explicitly below.
      GRADLE_JAVA_ARGS: >-
        -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_AARCH64,JAVA_HOME_27_AARCH64
        -Porg.gradle.java.installations.auto-download=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select exact release coordinates
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release-versions.sh "v$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Locate native artifacts and Linux reference from earlier runs
        id: artifacts
        if: inputs.artifacts-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts-run-id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          linux=$(bash .github/scripts/artifacts-run.sh "$ARTIFACTS_RUN_ID" libink-linux-x86_64 libink-linux-x86_64-debug-symbols)
          windows=$(bash .github/scripts/artifacts-run.sh "$ARTIFACTS_RUN_ID" ink-windows-x86_64)
          arm64=$(bash .github/scripts/artifacts-run.sh "$ARTIFACTS_RUN_ID" libink-linux-arm64 libink-linux-arm64-debug-symbols ink-windows-arm64 native-linux-arm64-tests)
          reference=$(bash .github/scripts/artifacts-run.sh "$ARTIFACTS_RUN_ID" linux-parity-reference)
          printf 'linux=%s\nwindows=%s\narm64=%s\nreference=%s\n' "$linux" "$windows" "$arm64" "$reference" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          architecture: aarch64
          java-version: |
            25
            27
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Select Zulu test runtime
        if: matrix.runtime != 'jbr25'
        run: |
          if [[ '${{ matrix.runtime }}' == zulu25 ]]; then
            echo "BYTEINK_TEST_JAVA_HOME=$JAVA_HOME_25_AARCH64" >> "$GITHUB_ENV"
          else
            echo "BYTEINK_TEST_JAVA_HOME=$JAVA_HOME_27_AARCH64" >> "$GITHUB_ENV"
          fi
      - name: Install pinned JBR 25 SDK
        if: matrix.runtime == 'jbr25'
        run: bash .github/scripts/setup-jbr.sh linux-aarch64
      # Every platform's library: the loader jar the suites and consumer smoke test use bundles all
      # four, and publishing it packages both Linux debug-symbol files.
      # Without a token, download-artifact reads the current run; a token selects run-id instead.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libink-linux-x86_64
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.linux && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.linux || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libink-linux-x86_64-debug-symbols
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.linux && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.linux || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ink-windows-x86_64
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.windows && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.windows || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libink-linux-arm64
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.arm64 && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.arm64 || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libink-linux-arm64-debug-symbols
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.arm64 && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.arm64 || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ink-windows-arm64
          path: native/build/out
          github-token: ${{ steps.artifacts.outputs.arm64 && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.arm64 || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux-arm64-tests
          path: native/build/linux-arm64-tests
          github-token: ${{ steps.artifacts.outputs.arm64 && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.arm64 || github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-parity-reference
          path: linux-reference
          github-token: ${{ steps.artifacts.outputs.reference && github.token || '' }}
          run-id: ${{ steps.artifacts.outputs.reference || github.run_id }}
      - name: Run upstream Linux arm64 C++ subset
        run: |
          tests=()
          while read -r target; do tests+=("native/build/linux-arm64-tests/${target##*:}"); done \
            < native/build/linux-arm64-tests/targets.txt
          [[ ${#tests[@]} == 5 ]]
          mkdir -p native/build/linux-arm64-tests/results
          for test in "${tests[@]}"; do
            # Artifacts do not keep the executable bit.
            chmod +x "$test"
            "$test" "--gtest_output=xml:native/build/linux-arm64-tests/results/$(basename "$test").xml"
          done
      # Skiko links EGL even for headless software rendering in the main build/consumer tests.
      - name: Install graphics runtime and offscreen test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libvulkan1 mesa-vulkan-drivers libxi6 libxtst6
      - name: Build, consumer smoke, full suites and synthetic fidelity comparison
        run: |
          reference="$PWD/linux-reference/byteink-testing/build/desktop-parity"
          ./gradlew build -PbyteinkPortable=true :upstream:checkLinuxLibrary :upstream:checkWindowsLibrary \
            :upstream:checkLinuxArm64Library :upstream:checkWindowsArm64Library \
            :conformance:oracle:oracleProduction :conformance:oracle:installDist \
            :byteink-testing:desktopParityCompare :byteink-testing:androidFidelityMatrix --continue \
            "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME" \
            "-PbyteinkParityFixtures=$reference/fixtures" "-PbyteinkParityReference=$reference" \
            -PbyteinkFuzzIterations=20000 -PbyteinkFuzzSeed=${{ github.run_number }} \
            $GRADLE_JAVA_ARGS
      - name: Compare shipped arm64 and x86_64 engine geometry strictly
        run: |
          "$BYTEINK_TEST_JAVA_HOME/bin/java" -cp 'conformance/oracle/build/install/oracle/lib/*' com.vivenotes.byteink.oracle.OracleKt \
            compare --reference linux-reference/conformance/oracle/build/oracle/oracleProduction.tsv \
            --candidate conformance/oracle/build/oracle/oracleProduction.tsv \
            --report conformance/oracle/build/reports/linux-arm64-vs-linux-x86_64-production.md
      - name: Verify mesh shaders on OpenGL and native X11 pen input
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a ./gradlew :byteink-compose:meshGpuTest :byteink-compose:desktopPenTest
          "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME" $GRADLE_JAVA_ARGS
      - name: Verify mesh shaders on EGL without X11
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
        run: >-
          env -u DISPLAY ./gradlew :byteink-compose:meshEglTest
          "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME" $GRADLE_JAVA_ARGS
      - name: Install native Wayland test dependencies
        if: matrix.runtime == 'jbr25'
        run: sudo apt-get install -y weston libwayland-dev libweston-13-dev build-essential pkg-config
      - name: Verify native Wayland tablet and immediate authoring
        if: matrix.runtime == 'jbr25'
        run: |
          for scale in 1 2; do
            BYTEINK_WAYLAND_TEST_SCALE="$scale" bash byteink-compose/src/test/wayland/run.sh \
              "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME" $GRADLE_JAVA_ARGS
          done
      - name: Verify native Wayland shared-memory and Mesa Vulkan presentation
        if: matrix.runtime == 'jbr25'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
        run: |
          # Mesa packages use either an architecture-qualified or a plain ICD filename.
          lavapipe_icd=$(dpkg -L mesa-vulkan-drivers | sed -n '/\/lvp_icd\(\.aarch64\)\?\.json$/p')
          [[ -n "$lavapipe_icd" && -f "$lavapipe_icd" ]] || {
            echo 'Expected one installed Mesa lavapipe ICD manifest.' >&2
            exit 1
          }
          printf 'Mesa lavapipe ICD: %s\n' "$lavapipe_icd"
          export VK_DRIVER_FILES="$lavapipe_icd" VK_ICD_FILENAMES="$lavapipe_icd"
          for vulkan in false true; do
            for scale in 1 2; do
              BYTEINK_WAYLAND_TEST_SUITE=presentation BYTEINK_WAYLAND_TEST_VULKAN="$vulkan" \
                BYTEINK_WAYLAND_TEST_SCALE="$scale" \
                BYTEINK_WAYLAND_TEST_OUTPUT="$PWD/build/wayland-presentation/vulkan-$vulkan-scale-$scale" \
                bash byteink-compose/src/test/wayland/run.sh \
                "-PbyteinkTestJavaHome=$BYTEINK_TEST_JAVA_HOME" $GRADLE_JAVA_ARGS
            done
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-${{ matrix.runtime }}-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            native/build/linux-arm64-tests/results/
            conformance/oracle/build/oracle/
            conformance/oracle/build/reports/
            byteink-testing/build/desktop-parity/
            byteink-compose/build/reports/wayland-gpu/
            build/wayland-presentation/
            byteink-compose/build/reports/performance/
            byteink-testing/build/reports/performance/
            byteink-testing/build/reports/android-matrix*/
            consumer-tests/build/reports/consumer/
            **/hs_err_pid*.log
            build/wayland-pen/fixture/*.xml
            build/wayland-pen/fixture/*.log
          if-no-files-found: error

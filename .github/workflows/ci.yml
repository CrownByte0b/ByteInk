name: ci

# The complete pipeline. Each job is a reusable workflow in its own file, which can also be
# started alone from the Actions tab.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0 or 0.2.0-rc.1); leave empty to run checks only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.version != '') }}

jobs:
  release:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}

  native-linux:
    needs: [release]
    uses: ./.github/workflows/native-linux.yml

  native-windows:
    needs: [release]
    uses: ./.github/workflows/native-windows.yml

  native-linux-tests:
    needs: [release]
    uses: ./.github/workflows/native-linux-tests.yml

  native-pin:
    needs: [release]
    uses: ./.github/workflows/native-pin.yml

  # The JVM and publish jobs request actions: read to download another run's artifacts when
  # started alone. A caller must grant every permission its called jobs request.
  jvm-linux:
    needs: [release, native-linux, native-windows]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/jvm-linux.yml
    with:
      version: ${{ needs.release.outputs.version }}

  jvm-windows:
    needs: [release, jvm-linux]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/jvm-windows.yml
    with:
      version: ${{ needs.release.outputs.version }}

  publish:
    if: needs.release.outputs.version != ''
    needs: [release, native-linux, native-windows, native-linux-tests, native-pin, jvm-linux, jvm-windows]
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      upload: true

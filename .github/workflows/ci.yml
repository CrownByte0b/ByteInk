name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: Native Linux build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # gradle/gradle-daemon-jvm.properties asks for an Azul JDK 27 for the Gradle daemon.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 27
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      # Bazel unpacks an 8 GB LLVM toolchain; the runner's preinstalled SDKs, unused here, make room.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      # Bazel's downloads (native/common.sh), which the pins and patches decide. Its disk cache of
      # compiled actions would exceed GitHub's cache quota across the native jobs, so builds are cold.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/byteink/bazel/repository
          key: bazel-repository-linux-${{ hashFiles('upstream/pins.properties', 'native/*.sh', 'native/patches/*.patch') }}
          restore-keys: bazel-repository-linux-
      - name: Build libink.so
        run: native/build-linux.sh
      - name: Check it
        run: ./gradlew :upstream:checkLinuxLibrary
      - name: Upload libink.so
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libink-linux-x86_64
          # The files keep their path below the wildcard, <commit>/linux-x86_64/.
          path: |
            native/build/out/*/linux-x86_64/libink.so
            native/build/out/*/linux-x86_64/build.properties
          if-no-files-found: error

  native-windows:
    name: Native Windows cross-build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # gradle/gradle-daemon-jvm.properties asks for an Azul JDK 27 for the Gradle daemon.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 27
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      # Bazel unpacks an 8 GB LLVM toolchain; the runner's preinstalled SDKs, unused here, make room.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/byteink/bazel/repository
          key: bazel-repository-windows-${{ hashFiles('upstream/pins.properties', 'native/*.sh', 'native/patches/*.patch') }}
          restore-keys: bazel-repository-windows-
      - name: Build ink.dll
        run: native/build-windows.sh
      - name: Check it
        run: ./gradlew :upstream:checkWindowsLibrary
      - name: Upload ink.dll
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ink-windows-x86_64
          path: |
            native/build/out/*/windows-x86_64/ink.dll
            native/build/out/*/windows-x86_64/build.properties
          if-no-files-found: error

  native-linux-tests:
    name: google/ink's C++ tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bazel unpacks an 8 GB LLVM toolchain; the runner's preinstalled SDKs, unused here, make room.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/byteink/bazel/repository
          key: bazel-repository-tests-${{ hashFiles('upstream/pins.properties', 'native/*.sh', 'native/patches/*.patch') }}
          restore-keys: bazel-repository-tests-
      - name: Test google/ink at the pinned commit
        run: native/test-linux.sh

  native-pin:
    name: Native pin against google/ink history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # gradle/gradle-daemon-jvm.properties asks for an Azul JDK 27 for the Gradle daemon.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 27
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Scan google/ink
        run: ./gradlew :upstream:scanGoogleInk
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: google-ink-jni-scan
          path: upstream/build/reports/google-ink-jni-scan.md
          if-no-files-found: ignore

  jvm-linux:
    name: JVM build and tests on Linux
    needs: [native-linux, native-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Gradle daemon runs on Azul 27 (gradle/gradle-daemon-jvm.properties); the loader's tests
      # also run on JDK 25, the oldest byteink supports.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: |
            25
            27
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      # The libraries the native jobs built land where the native scripts put them,
      # native/build/out/<commit>/<platform>/, which is where the build looks for the pinned commit.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libink-linux-x86_64
          path: native/build/out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ink-windows-x86_64
          path: native/build/out
      # The loader jar bundles both libraries. The fuzzer runs longer than locally, on a new seed
      # each run; a failure names the seed and iteration that reproduce it.
      - name: Build and test
        run: >-
          ./gradlew build :conformance:oracle:oracleCompare :conformance:oracle:installDist --continue
          -PbyteinkFuzzIterations=20000 -PbyteinkFuzzSeed=${{ github.run_number }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-download=false
      - name: Upload the oracle's dumps and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-linux
          path: |
            conformance/oracle/build/oracle/
            conformance/oracle/build/reports/oracle.md
          if-no-files-found: ignore
      # The oracle as a plain Java application, for the Windows job.
      - name: Upload the oracle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-application
          path: conformance/oracle/build/install/oracle/
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-linux-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  windows-oracle:
    name: Windows loading and oracle against Google's binary
    needs: [jvm-linux]
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 27
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oracle-application
          path: oracle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oracle-linux
          path: linux
      # byteink's loader extracts the ink.dll its jar bundles into %LOCALAPPDATA%\byteink\natives;
      # on this fresh runner the four JVMs race to do it first, and each must end up loading it.
      - name: Load the library from four JVMs at once
        run: |
          pids=()
          for run in 1 2 3 4; do
            java --enable-native-access=ALL-UNNAMED -cp "oracle/lib/*" com.vivenotes.byteink.oracle.OracleKt \
              dump --out "run$run.tsv" --label "byteink ${GITHUB_SHA::12} windows" &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          for run in 2 3 4; do cmp run1.tsv "run$run.tsv"; done
          mv run1.tsv oracleWindows.tsv
      - name: Compare with Google's binary on Linux
        run: >-
          java -cp "oracle/lib/*" com.vivenotes.byteink.oracle.OracleKt
          compare --reference linux/oracle/oracleGoogle.tsv --candidate oracleWindows.tsv --report oracle-windows.md
      - name: Upload the dump and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-windows
          path: |
            oracleWindows.tsv
            oracle-windows.md
          if-no-files-found: ignore
